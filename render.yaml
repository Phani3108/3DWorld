services:
  - type: web
    name: 3dworld-server
    runtime: node
    rootDir: server
    plan: free
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DEV_MODE
        value: "0"
      - key: OPEN_ACCESS
        value: "0"
      - key: TRUST_PROXY
        value: "1"
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: EXTRA_ALLOWED_ORIGIN
        sync: false
      # Claude resident answers (optional). Leave unset to serve curated answers only.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_DAILY_BUDGET_USD
        value: "2"
      - key: LLM_USER_DAILY_TURNS
        value: "25"
